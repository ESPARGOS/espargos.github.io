<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="robots" content="noindex">
	<title>ESPARGOS tunnel: restoring page…</title>
	<style>
		html, body { height: 100%; margin: 0; }
		body {
			background: #111; color: #eee; text-align: center;
			font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
			display: flex; align-items: center; justify-content: center;
		}
		a { color: #6cf; }
		p { max-width: 32rem; padding: 0 1rem; line-height: 1.5; }
	</style>
</head>
<body>
	<p id="msg">Restoring the device page…</p>

	<!--
		This is a FALLBACK page. The device web UI at /tunnel/device/ is normally served by the tunnel
		Service Worker; this static file is reached if a navigation bypasses it. This does not mean the
		serial connection was lost. Ask the parent to supply the document over its existing connection,
		preserving this URL (including its page hash) so relative assets and navigation still work.
	-->
	<script>
	(async function () {
		try {
			const tunnel = window.parent !== window && window.parent.__espargosTunnel;
			if (!tunnel || !tunnel.loadDevicePage) throw new Error("No connected tunnel in the parent page");
			const html = await tunnel.loadDevicePage();
			document.open();
			document.write(html);
			document.close();
		} catch (error) {
			const m = document.getElementById("msg");
			m.textContent = "Could not restore the device page: " + error.message + ". ";
			const link = document.createElement("a");
			link.href = "/tunnel/";
			link.target = "_top";
			link.textContent = "Return to the ESPARGOS tunnel page";
			m.append(link);
		}
	})();
	</script>
</body>
</html>
