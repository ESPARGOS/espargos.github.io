{{ define "main" }}
<main class="container px-4 py-4">
  <div class="news-index mx-auto">
    <header class="news-index-header">
      <h1 class="display-5 fw-bold mb-3"><span class="text-gradient">{{ .Title }}</span></h1>
    </header>
    <div class="news-list">
      {{ range .RegularPages.ByDate.Reverse }}
      {{ $article := . }}
      <article class="news-preview">
          {{ with .Resources.GetMatch .Params.teaser }}
          {{ $image := .Resize "800x webp q85" }}
          <a class="news-teaser" href="{{ $article.RelPermalink }}" tabindex="-1" aria-hidden="true">
            <img src="{{ $image.RelPermalink }}" alt="" width="{{ $image.Width }}" height="{{ $image.Height }}" loading="lazy" decoding="async">
          </a>
          {{ end }}
          <div class="news-preview-body">
            <time class="news-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
            <h2 class="news-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
            <p class="news-summary">{{ .Params.summary }}</p>
            <a class="news-read-more" href="{{ .RelPermalink }}" aria-label="Read article: {{ .Title }}">Read article <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
          </div>
      </article>
      {{ end }}
    </div>
  </div>
</main>
{{ end }}
